# Fly.io 배포 설정. 시크릿(SUPABASE_*, OPENAI_API_KEY)은 여기 두지 않고
# `fly secrets set` 으로 넣는다 — fly.toml 은 git 에 올라간다.

app = "piggyon-api"
# 도쿄. Fly 에 서울(icn) 리전은 없다 — Asia Pacific 은 bom/sin/syd/nrt 뿐이라
# 한국에서 가장 가까운 곳이 여기다. Supabase(ap-northeast-2, 서울)와는 리전이
# 갈리지만, 측정상 DB 왕복은 지배적 비용이 아니었다 (docs/11-deployment.md §1).
primary_region = "nrt"

[build]

[env]
  STORAGE_BACKEND = "supabase"
  # mini 는 아니다. 가드가 없는 id·사유 코드·금지된 주장은 걸러내지만 맞는
  # 어휘로 쓴 틀린 추론은 통과하고, 정본 시나리오에서 mini 가 낸 것이 정확히
  # 그것이었다 — 준비 시각을 마감 이후로 옮기라 하고, 승인된 대안이 있는데
  # 없다고 하고, 납기를 여섯 시간 넘기는 열차를 권했다. 근거는 전부 입력에
  # 있었다 (docs/10-ai-usage.md §2.2).
  OPENAI_MODEL = "gpt-4o"

[http_service]
  internal_port = 8080
  force_https = true

  # 데모 기간에는 상시 가동한다. 슬립을 허용하면 ortools+pandas 임포트
  # (정상 CPU 에서도 1.4초) 를 심사 중 첫 요청이 떠안는다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # CP-SAT 은 블로킹으로 돌고 vCPU 는 하나다. 동시 요청을 몰아주면
  # 솔버끼리 CPU 를 뺏는다.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

# grace_period 는 임포트가 끝나기 전에 헬스체크가 죽이지 않을 만큼 준다.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
