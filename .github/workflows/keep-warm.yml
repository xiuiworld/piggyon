# 심사 기간 동안 배포를 살아 있는 상태로 두고, 죽으면 알아차린다.
#
# 본선 안내 3.4)는 배포 URL을 "심사 기간 동안 언제든 접속 가능한" 상태로 요구한다.
#
# 원래 이 워크플로는 Render 무료 인스턴스의 15분 슬립을 막으려고 있었다. 배포가
# Fly 로 옮겨가면서(docs/11-deployment.md) 그 이유는 사라졌다 — fly.toml 이
# `auto_stop_machines = "off"` 에 `min_machines_running = 1` 이라 머신이 잠들지
# 않는다. 그런데도 주소만 Render 로 남아 있어서, 현행 서비스가 아니라 롤백용
# 서비스를 데우고 있었다.
#
# 지금 이 워크플로가 하는 일은 둘이다:
#
#   1. Supabase 를 깨워 둔다. 무료 프로젝트는 오래 놀면 정지되고, /health 는
#      Supabase 테이블을 한 번 조회한다(app/storage.py 의 ping). 핑 하나가
#      그 타이머를 되돌린다.
#   2. API 가 죽거나 인메모리로 폴백하면 Actions 를 빨갛게 만든다. 지금 이
#      저장소에 알림 경로는 이것뿐이다.
#
# 간격이 15분인 이유: 5분은 Render 의 슬립 창에 맞춘 값이었다. Supabase 의 유휴
# 정지는 그보다 훨씬 긴 단위라 그렇게 자주 두드릴 이유가 없고, 남는 목적인
# 장애 감지에는 15분이면 충분하다.

name: keep-warm

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # 수동 실행

# 앞선 실행이 아직 응답을 기다리는 중이면 겹쳐 돌리지 않는다.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and report storage state
        run: |
          echo "$(date -u '+%H:%M:%SZ') pinging"
          # --max-time 60: Fly 는 정상이면 1초 안에 답한다. 머신이 재시작 중일
          # 때를 위한 여유이지, 콜드 스타트를 기다리려는 값이 아니다.
          # -w 로 실제 소요 시간을 남겨, Actions 로그가 응답 시간 기록이 되게 한다.
          BODY=$(curl -sS --max-time 60 \
                   -w '\n__TIME__%{time_total}__CODE__%{http_code}' \
                   https://piggyon-api.fly.dev/health)

          TIME=$(printf '%s' "$BODY" | sed -n 's/.*__TIME__\([0-9.]*\)__CODE__.*/\1/p')
          CODE=$(printf '%s' "$BODY" | sed -n 's/.*__CODE__\([0-9]*\)$/\1/p')
          JSON=$(printf '%s' "$BODY" | sed 's/\n*__TIME__.*//')

          echo "HTTP $CODE in ${TIME}s"
          echo "$JSON"

          [ "$CODE" = "200" ] || { echo "::error::health가 $CODE 를 반환"; exit 1; }

          # 저장소가 인메모리로 폴백했다면 기록은 재시작 때 사라진다. 조용히 넘기지 않는다.
          case "$JSON" in
            *'"storage_backend":"memory"'*)
              echo "::warning::인메모리로 폴백한 상태 — 재시작하면 시나리오·실행 기록이 사라진다" ;;
          esac
          case "$JSON" in
            *'"storage_reachable":false'*)
              echo "::warning::Supabase 도달 불가로 보고됨" ;;
          esac
